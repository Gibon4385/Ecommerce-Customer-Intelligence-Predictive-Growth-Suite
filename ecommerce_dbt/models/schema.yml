version: 2

sources:
  - name: raw_ecommerce
    schema: raw_ecommerce
    tables:
      - name: raw_orders
        config: &streaming_freshness
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 10, period: minute}
            error_after: {count: 15, period: minute}
      - name: raw_order_items
        config: *streaming_freshness
      - name: raw_products
      - name: raw_events
        config: *streaming_freshness
      - name: raw_reviews
        config: *streaming_freshness
      - name: raw_users
        config: *streaming_freshness
      - name: review_sentiment_scores

  - name: external_intermediate
    description: "Tables generated by external Python scripts but treated as intermediate models."
    database: "{{ env_var('DBT_PROJECT') }}"
    schema: dbt_ecommerce_intermediate
    tables:
      - name: int_review_sentiment_user
        description: "User-level sentiment aggregates."
        columns:
          - name: user_id
            data_type: STRING
            tests:
              - not_null
              - unique
      - name: int_review_sentiment_detail
        description: "Detail-level sentiment scores per review."
        columns:
          - name: review_id
            data_type: STRING
            tests:
              - not_null
              - unique
      - name: int_ltv_predictions
        description: "Predicted LTV per user from BQML."
        columns:
          - name: user_id
            data_type: STRING
            tests:
              - not_null
              - unique
          - name: predicted_profit_90_days
            data_type: FLOAT64
          - name: primary_driver
            data_type: STRING
          - name: primary_barrier
            data_type: STRING
      - name: int_product_pain_points
        description: "Top 3 pain points (keywords) per product from Python script."
        columns:
          - name: product_id
            data_type: STRING
            tests:
              - not_null
              - unique
